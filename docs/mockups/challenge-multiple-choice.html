<div class="screen">
  <div class="challenge-top">
    <span class="challenge-exit">✕</span>
    <div class="progress-track"><div class="progress-fill" style="width:62%"></div></div>
    <span class="progress-label">5 / 8</span>
  </div>

  <div class="challenge-body">
    <p class="challenge-ref">Genesis 9:12–13</p>
    <p class="challenge-prompt">What did God set in the clouds as the sign of his covenant after the flood?</p>
    <div class="option-list">
      <button class="option"><span class="option-letter">A</span> A dove carrying an olive branch</button>
      <button class="option is-selected"><span class="option-letter">B</span> A rainbow</button>
      <button class="option"><span class="option-letter">C</span> An altar of stones</button>
      <button class="option"><span class="option-letter">D</span> A pillar of cloud</button>
    </div>
  </div>

  <div class="challenge-footer">
    <button class="btn btn--primary btn--full">Submit Answer</button>
  </div>
