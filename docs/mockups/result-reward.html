<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen2Rev — Result / Reward</title>
<link rel="stylesheet" href="styles.css">
<style>
  .result-hero { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-8); padding: var(--spacing-64) var(--spacing-24) var(--spacing-24); text-align: center; }
  .result-icon { font-size: 64px; }
  .stat-list { display: flex; flex-direction: column; gap: var(--spacing-16); padding: var(--spacing-24); }
  .stat-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--spacing-16) var(--spacing-24); }
  .stat-row .label { font-family: var(--font-label); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: var(--spacing-8); }
  .stat-row .value { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--color-accent-olive); }
  .vault-note { background: var(--color-bg-parchment-dark); border-radius: var(--radius-md); padding: var(--spacing-16) var(--spacing-24); font-family: var(--font-body); font-style: italic; font-size: 14px; text-align: center; }

  @media (min-width: 1024px) {
    .stat-list { max-width: 480px; margin: 0 auto; }
    .vault-note { max-width: 480px; margin: 0 auto var(--spacing-24); }
    .result-footer { max-width: 480px; margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="mockup-nav"><a href="index.html">← All screens</a><a class="active" href="result-reward.html">Result / Reward</a></div>
<div class="screen">
  <div class="result-hero">
    <div class="result-icon">🏆</div>
    <p class="eyebrow">World 1 Complete</p>
    <h1 class="world-title">Genesis: Beaten</h1>
  </div>

  <div class="stat-list">
    <div class="stat-row"><span class="label">✦ Points earned</span><span class="value">+80</span></div>
    <div class="stat-row"><span class="label">🔥 Streak</span><span class="value">4 days</span></div>
    <div class="stat-row"><span class="label">📖 Verses mastered</span><span class="value">5</span></div>
  </div>

  <div class="vault-note">"In the beginning, God created the heavens and the earth." — added to your Memory Vault</div>

  <div class="challenge-footer result-footer">
    <button class="btn btn--primary btn--full">Continue to World 2</button>
  </div>
</div>
</body>
</html>
