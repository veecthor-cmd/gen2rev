<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gen2Rev — Home / Streak</title>
<link rel="stylesheet" href="styles.css">
<style>
  .home-top { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-24); }
  .streak-hero { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-8); padding: 0 var(--spacing-24) var(--spacing-32); text-align: center; }
  .streak-flame { font-size: 48px; }
  .streak-count { font-family: var(--font-display); font-weight: 900; font-size: 36px; margin: 0; }
  .continue-card { margin: 0 var(--spacing-24) var(--spacing-24); background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--spacing-24); display: flex; align-items: center; gap: var(--spacing-16); }
  .continue-card .node-circle { flex-shrink: 0; }
  .continue-card .info { flex: 1; }
  .continue-card .info .k { font-family: var(--font-label); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-accent-olive); margin:0 0 4px; }
  .continue-card .info .v { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin: 0; }
  .nudge { margin: 0 var(--spacing-24) var(--spacing-48); background: var(--color-bg-parchment-dark); border-radius: var(--radius-md); padding: var(--spacing-16) var(--spacing-24); font-family: var(--font-body); font-size: 14px; text-align: center; }

  @media (min-width: 1024px) {
    .continue-card, .nudge { max-width: 560px; margin-left: auto; margin-right: auto; }
    .nudge { margin-bottom: var(--spacing-48); }
  }
</style>
</head>
<body>
<div class="mockup-nav"><a href="index.html">← All screens</a><a class="active" href="home-streak.html">Home / Streak</a></div>
<div class="screen">
  <div class="home-top">
    <span class="chip chip--olive">✦ 120 pts</span>
    <span class="body-small">Disciple</span>
  </div>

  <div class="streak-hero">
    <div class="streak-flame">🔥</div>
    <p class="streak-count">4</p>
    <p class="body-small">day streak — come back tomorrow to keep it alive</p>
  </div>

  <div class="continue-card">
    <div class="node-circle node-circle--current">Ex</div>
    <div class="info">
      <p class="k">Continue where you left off</p>
      <p class="v">World 2: Exodus — Challenge 3 of 8</p>
    </div>
  </div>

  <div class="nudge">✦ Today's verse: Genesis 9:12 — review it in your Memory Vault</div>

  <div class="challenge-footer">
    <button class="btn btn--primary btn--full">Continue Playing</button>
  </div>
</div>
</body>
</html>
